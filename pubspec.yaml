name: taskquest
description: "A gamified learning platform for CS students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.1.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Syne-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Syne-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Syne-VariableFont_wght.ttf
          weight: 800
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
